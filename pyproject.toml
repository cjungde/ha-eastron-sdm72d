[tool.ruff]
target-version = "py311"
line-length = 88
# Helper/one-off scripts under tools/ are not part of the shipped integration.
extend-exclude = ["tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
# Line length is enforced by the formatter; long strings/URLs are left as-is.
ignore = ["E501"]

[tool.ruff.lint.isort]
force-sort-within-sections = true

[tool.pytest.ini_options]
# The meter tests are async; the vendored suite was written for auto mode.
asyncio_mode = "auto"
testpaths = ["tests"]
